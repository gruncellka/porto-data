name: validation

on:
    push:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref_name }}
    cancel-in-progress: true

permissions:
    contents: read

env:
    PYTHON_VERSION: '3.13'

jobs:
    schema:
        name: schema
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                  python-version: ${{ env.PYTHON_VERSION }}
                  cache: 'pip'
            - name: schema
              run: make schema

    format:
        name: format
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                  python-version: ${{ env.PYTHON_VERSION }}
                  cache: 'pip'
            - name: format
              run: make format CHECK=1

    lint:
        name: lint
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                  python-version: ${{ env.PYTHON_VERSION }}
                  cache: 'pip'
            - name: lint
              run: make lint

    types:
        name: types
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                  python-version: ${{ env.PYTHON_VERSION }}
                  cache: 'pip'
            - name: types
              run: make types

    test:
        name: test
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                  python-version: ${{ env.PYTHON_VERSION }}
                  cache: 'pip'
            - name: test
              run: make test-cov
            - name: Upload coverage
              uses: codecov/codecov-action@v6
              continue-on-error: true
              with:
                  token: ${{ secrets.CODECOV_TOKEN }}

    mappings:
        name: mappings
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                  python-version: ${{ env.PYTHON_VERSION }}
                  cache: 'pip'
            - name: mappings
              run: make mappings

    markets:
        name: markets
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                  python-version: ${{ env.PYTHON_VERSION }}
                  cache: 'pip'
            - name: markets
              run: make markets

    addresses:
        name: addresses
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                  python-version: ${{ env.PYTHON_VERSION }}
                  cache: 'pip'
            - name: addresses
              run: make addresses

    kinds:
        name: kinds
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                  python-version: ${{ env.PYTHON_VERSION }}
                  cache: 'pip'
            - name: kinds
              run: make kinds

    delivery:
        name: delivery
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                  python-version: ${{ env.PYTHON_VERSION }}
                  cache: 'pip'
            - name: delivery
              run: make delivery

    graph:
        name: graph
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                  python-version: ${{ env.PYTHON_VERSION }}
                  cache: 'pip'
            - name: graph
              run: make graph

    metadata:
        name: metadata
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                  python-version: ${{ env.PYTHON_VERSION }}
                  cache: 'pip'
            - name: metadata
              run: make metadata CHECK=1

    validate:
        name: validate
        if: always()
        needs:
            - schema
            - format
            - lint
            - types
            - test
            - mappings
            - markets
            - addresses
            - kinds
            - delivery
            - graph
            - metadata
        runs-on: ubuntu-latest
        steps:
            - name: All required jobs passed
              run: |
                  set -eu
                  for result in \
                    ${{ needs.schema.result }} \
                    ${{ needs.format.result }} \
                    ${{ needs.lint.result }} \
                    ${{ needs.types.result }} \
                    ${{ needs.test.result }} \
                    ${{ needs.mappings.result }} \
                    ${{ needs.markets.result }} \
                    ${{ needs.addresses.result }} \
                    ${{ needs.kinds.result }} \
                    ${{ needs.delivery.result }} \
                    ${{ needs.graph.result }} \
                    ${{ needs.metadata.result }}; do
                    case "$result" in
                      success) ;;
                      *) echo "required job result=$result"; exit 1 ;;
                    esac
                  done
                  echo "validate OK"
