name: publish

on:
    push:
        tags:
            - 'v*'
    workflow_dispatch:
        inputs:
            publish_target:
                description: 'Publish target (tag push always runs both)'
                required: true
                default: both
                type: choice
                options:
                    - both
                    - npm
                    - pypi

concurrency:
    group: ${{ github.workflow }}-${{ github.ref_name }}
    cancel-in-progress: false

env:
    NODE_VERSION: '20'
    NODE_VERSION_NPM: '22'
    PYTHON_VERSION: '3.13'

jobs:
    validate:
        name: validate
        uses: ./.github/workflows/validation.yml

    artifact:
        name: artifact
        runs-on: ubuntu-latest
        needs: [validate]
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                  python-version: ${{ env.PYTHON_VERSION }}
                  cache: pip
                  cache-dependency-path: pyproject.toml
            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
            - name: Build, verify, smoke
              run: |
                  python -m pip install --upgrade pip
                  pip install -e ".[dev]"
                  make artifact
            - name: Upload npm artifact
              uses: actions/upload-artifact@v4
              with:
                  name: npm-package
                  path: gruncellka-porto-data-*.tgz
            - name: Upload PyPI artifact
              uses: actions/upload-artifact@v4
              with:
                  name: pypi-package
                  path: dist/

    publish_npm:
        name: Publish to npm
        runs-on: ubuntu-latest
        needs: [artifact]
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.publish_target != 'pypi'
        permissions:
            contents: read
            id-token: write
            packages: write
        steps:
            - uses: actions/download-artifact@v4
              with:
                  name: npm-package
            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION_NPM }}
            - name: Install latest npm (OIDC trusted publishing)
              run: npm install -g npm@latest
            - name: Publish to npm
              run: npm publish --access public --provenance *.tgz

    publish_pypi:
        name: Publish to PyPI
        runs-on: ubuntu-latest
        needs: [artifact]
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.publish_target != 'npm'
        permissions:
            contents: read
            id-token: write
        steps:
            - uses: actions/download-artifact@v4
              with:
                  name: pypi-package
                  path: dist
            - name: Publish to PyPI (Trusted Publisher)
              uses: pypa/gh-action-pypi-publish@release/v1
              with:
                  packages-dir: dist

    release:
        name: Create GitHub Release
        runs-on: ubuntu-latest
        needs: [publish_npm, publish_pypi]
        if: startsWith(github.ref, 'refs/tags/')
        permissions:
            contents: write
        steps:
            - name: Create GitHub Release
              uses: softprops/action-gh-release@v1
              with:
                  tag_name: ${{ github.ref_name }}
                  name: Release ${{ github.ref_name }}
                  draft: false
                  prerelease: false
                  generate_release_notes: true
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
