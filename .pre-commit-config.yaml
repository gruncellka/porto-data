# Pre-commit configuration for porto-data
#
# Hook IDs match CI job / Make concern names: schema, mappings, …, format, lint, types.
# Run manually: pre-commit run --all-files

fail_fast: true

repos:
    - repo: local
      hooks:
          - id: schema
            name: schema
            entry: bash -c 'if [ -f venv/bin/activate ]; then . venv/bin/activate; fi && PYTHONPATH=. python -m cli.main validate --type schema'
            language: system
            files: ^porto_data/(policy|formats|schemas)/.*\.json$|^porto_data/providers/[^/]+/.*\.json$|^porto_data/(mappings|metadata|providers)\.json$
            pass_filenames: false

          - id: mappings
            name: mappings
            entry: bash -c 'if [ -f venv/bin/activate ]; then . venv/bin/activate; fi && PYTHONPATH=. python -m cli.main validate --type mappings'
            language: system
            files: ^porto_data/(mappings|metadata|providers)\.json$|^porto_data/providers/[^/]+/.*\.json$|^porto_data/schemas/.*\.schema\.json$
            pass_filenames: false

          - id: markets
            name: markets
            entry: bash -c 'if [ -f venv/bin/activate ]; then . venv/bin/activate; fi && PYTHONPATH=. python -m cli.main validate --type markets'
            language: system
            files: ^porto_data/policy/markets\.json$|^porto_data/providers\.json$|^porto_data/schemas/markets\.schema\.json$|^porto_data/mappings\.json$
            pass_filenames: false

          - id: addresses
            name: addresses
            entry: bash -c 'if [ -f venv/bin/activate ]; then . venv/bin/activate; fi && PYTHONPATH=. python -m cli.main validate --type addresses'
            language: system
            files: ^porto_data/formats/(addresses|layouts)\.json$|^porto_data/policy/jurisdictions\.json$|^porto_data/schemas/addresses\.schema\.json$
            pass_filenames: false

          - id: kinds
            name: kinds
            entry: bash -c 'if [ -f venv/bin/activate ]; then . venv/bin/activate; fi && PYTHONPATH=. python -m cli.main validate --type kinds && git add docs/kinds.md'
            language: system
            files: ^porto_data/providers/[^/]+/(products|services|features|graph)\.json$|^porto_data/providers/[^/]+/prices/.*\.json$|^porto_data/schemas/kinds\.schema\.json$|^docs/kinds\.md$
            pass_filenames: false

          - id: delivery
            name: delivery
            entry: bash -c 'if [ -f venv/bin/activate ]; then . venv/bin/activate; fi && PYTHONPATH=. python -m cli.main validate --type delivery'
            language: system
            files: ^porto_data/providers/[^/]+/(products|features|graph)\.json$|^porto_data/schemas/products\.schema\.json$|^porto_data/policy/markets\.json$|^porto_data/providers\.json$
            pass_filenames: false

          - id: graph
            name: graph
            entry: bash -c 'if [ -f venv/bin/activate ]; then . venv/bin/activate; fi && PYTHONPATH=. python -m cli.main validate --type graph'
            language: system
            files: ^porto_data/providers/.*/graph\.json$|^porto_data/providers/.*/(products|zones|weights|services|features|marks|rules)\.json$|^porto_data/providers/.*/prices/.*\.json$|^porto_data/(policy|formats|schemas)/.*\.json$
            pass_filenames: false

          - id: metadata
            name: metadata
            entry: bash -c 'if [ -f venv/bin/activate ]; then . venv/bin/activate; fi && PYTHONPATH=. python -m cli.main metadata && git add porto_data/metadata.json'
            language: system
            files: ^porto_data/(policy|formats|schemas)/.*\.json$|^porto_data/providers/[^/]+/.*\.json$|^porto_data/mappings\.json$
            pass_filenames: false

          - id: metadata-bump
            name: metadata-bump
            entry: bash -c 'if [ -f venv/bin/activate ]; then . venv/bin/activate; fi && PYTHONPATH=. python -m cli.main metadata && git add porto_data/metadata.json'
            language: system
            files: ^pyproject\.toml$|^package\.json$
            pass_filenames: false

          - id: eol
            name: eol
            entry: bash -c 'n=$(printf "\\n"); for f in package.json pyproject.toml; do [ -f "$f" ] && [ "$(tail -c 1 "$f" 2>/dev/null)" != "$n" ] && printf "\\n" >> "$f" && git add "$f"; done; true'
            language: system
            files: ^pyproject\.toml$|^package\.json$
            pass_filenames: false

    - repo: local
      hooks:
          - id: json
            name: json
            entry: bash -c 'shopt -s nullglob; for file in porto_data/*.json porto_data/schemas/*.json porto_data/policy/*.json porto_data/formats/*.json porto_data/providers/*/*.json porto_data/providers/*/prices/*.json; do python3 -m json.tool "$file" > /dev/null || exit 1; done'
            language: system
            types: [json]
            files: ^porto_data/(policy|formats|schemas)/.*\.json$|^porto_data/providers/[^/]+/.*\.json$|^porto_data/(mappings|metadata|providers)\.json$
            pass_filenames: false

          - id: format
            name: format
            entry: bash -c 'if [ -f venv/bin/activate ]; then . venv/bin/activate; fi; for f in "$@"; do case "$f" in *.json) python3 scripts/format_json_file.py "$f" || exit 1 ;; *.py) ruff format "$f" || exit 1 ;; esac; done; git add "$@"' bash
            language: system
            files: ^porto_data/(policy|formats|schemas)/.*\.json$|^porto_data/providers/[^/]+/.*\.json$|^porto_data/(mappings|metadata|providers)\.json$|^(scripts|cli|tests)/.*\.py$
            pass_filenames: true
            require_serial: true

          - id: lint
            name: lint
            entry: bash -c 'if [ -f venv/bin/activate ]; then . venv/bin/activate; fi && ruff check --fix --exit-non-zero-on-fix "$@"' bash
            language: system
            files: ^(scripts|cli|tests)/.*\.py$
            pass_filenames: true

          - id: types
            name: types
            entry: bash -c 'if [ -f venv/bin/activate ]; then . venv/bin/activate; fi && PYTHONPATH=. mypy --config-file=pyproject.toml scripts/ cli/'
            language: system
            files: ^(scripts|cli)/.*\.py$
            pass_filenames: false

    - repo: https://github.com/pre-commit/pre-commit-hooks
      rev: v4.5.0
      hooks:
          - id: trailing-whitespace
          - id: end-of-file-fixer
          - id: check-yaml
          - id: check-json
          - id: check-added-large-files
            args: ['--maxkb=300']
            exclude: ^docs/providers/.*\.pdf$
          - id: check-merge-conflict
          - id: check-case-conflict
          - id: no-commit-to-branch
            args: ['--branch', 'main']
          - id: detect-private-key
